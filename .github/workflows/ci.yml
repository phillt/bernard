name: CI

on:
  push:
    branches: [master, bernard-1-0-0, feat/applets, applets-round-2]
  pull_request:
    # **No `branches:` filter, deliberately — an allowlist here fails OPEN.**
    #
    # A base branch missing from the list does not fail CI, it silently never
    # runs it, and `gh pr checks` then answers "no checks reported", which reads
    # as clean. This repo has been burned by that twice: `bernard-1-0-0` was
    # missing while every 1.0.0 PR targeted it, and `applets-round-2` was
    # missing while ELEVEN PRs (#481-#491) merged into it with zero checks —
    # adding it turned up 7 lint errors and 5 unformatted files that had already
    # shipped.
    #
    # The comment those two incidents left behind said "remember to add the next
    # epic branch", which is the fix that keeps not happening. A third case was
    # live when this was written: #547 and #548 are stacked PRs based on other
    # PR branches (`feat/retrieval-eval`, `feat/dedup-reinforce`), and no
    # allowlist can anticipate a base branch that is itself created per stack.
    #
    # Every pull request gets checked, whatever it targets. `push:` keeps its
    # allowlist — that one is about which branches get a build on every commit,
    # where a whitelist is the right shape and its failure mode is visible.

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # `scripts/` is outside the base tsconfig (it compiles, with `rootDir:
      # src`), so it needs its own no-emit pass — which is how two of the three
      # eval scripts silently stopped compiling against the `src/` they import.
      # `npm run lint` and `format:check` cover it directly; this is the third
      # of the three gates it was missing.
      - run: npm run typecheck:scripts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # **Seeds sample; they do not prove.** What generalises is the three
  # mechanisms #457 fixed — a shared spy rebound by a sibling, a module-load
  # singleton, and `paths.ts` frozen against a deleted `BERNARD_HOME`. This job
  # is the regression gate that stops them coming back, not the argument that
  # they are gone.
  #
  # The three seeds are chosen by measurement, not taste. With the fixes
  # reverted, each of the ten affected files fails under at least one of them
  # and every seed contributes something no other covers: 777 is the only one
  # of the six measured that catches `framework/agents/run.test.ts`, 5 the only
  # one that catches `tools/applet.test.ts` (the `paths.ts` case), and 42 the
  # only one of the three that catches `cron/runner.test.ts` — 16 of the 32
  # tests on its own. Any one seed alone would have reported success with most
  # of the suite still fragile: 1234 catches 9 of 32, 5 catches 4.
  #
  # `--sequence.shuffle` shuffles tests WITHIN a file as well as file order,
  # and every one of the 32 failures reproduces with its file run alone — so
  # this gate is about intra-file state, not cross-file leakage, which
  # `isolate: true` plus a per-file `BERNARD_HOME` already make impossible.
  #
  # Free: a shuffled run's median wall clock equals the baseline's (~17 s), and
  # the 17-28 s spread is worker packing rather than shuffle overhead.
  test-shuffled:
    name: Tests (shuffled, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 777, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:shuffle -- --sequence.seed=${{ matrix.seed }}
