<title>Bernard demo applet</title>
<link rel="stylesheet" href="/__bernard/tokens.css" />
<link rel="manifest" href="/__bernard/manifest.webmanifest" />

<main>
  <h1>Demo applet</h1>
  <p>
    Two ways to run the same question. There is no prompt here — the page holds handles to
    <code>search</code> and <code>web_answer</code>, and nothing else.
  </p>

  <label>Question <input id="q" value="what is the default port for PostgreSQL?" /></label>
  <button id="search">Search (no model)</button>
  <button id="ask" class="secondary">Ask (agent)</button>
  <p class="muted" id="last">…</p>
  <pre id="out">Ready.</pre>
</main>

<script>
  // The page never learns its own token or handles from markup — it fetches
  // them from its own origin. `connect-src 'self'` is what keeps that the only
  // place it can reach.
  let boot = null;

  async function bootstrap() {
    if (boot) return boot;
    const res = await fetch('/__bernard/bootstrap.json');
    if (!res.ok) throw new Error('bootstrap failed');
    boot = await res.json();
    return boot;
  }

  /** The applet's own persistent store (#422). POST even to read: the token
   *  gate exempts GET so that assets load, and this is data, not an asset. */
  async function store(body) {
    const b = await bootstrap();
    const res = await fetch('/__bernard/store', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-bernard-token': b.token },
      body: JSON.stringify(body),
    });
    return res.json();
  }

  async function invoke(action, args) {
    const b = await bootstrap();
    const res = await fetch('/__bernard/invoke', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-bernard-token': b.token },
      // A handle plus data. Never an action name, never a prompt — the host
      // resolves what to run from its own record.
      body: JSON.stringify({ handle: b.handles[action], args }),
    });
    return res.json();
  }

  async function run(action) {
    const out = document.getElementById('out');
    const question = document.getElementById('q').value;
    out.className = '';
    out.textContent = 'Working…';
    try {
      const body = await invoke(action, { question });
      if (!body.ok) {
        out.className = 'error';
        out.textContent = `${body.error.code}: ${body.error.message}`;
        return;
      }
      out.textContent =
        typeof body.result === 'string' ? body.result : JSON.stringify(body.result, null, 2);
      // Survives a host restart, and only this applet can read it.
      await store({ op: 'set', key: 'last', value: { question, action, at: Date.now() } });
      showLast();
    } catch (err) {
      out.className = 'error';
      out.textContent = String(err);
    }
  }

  async function showLast() {
    const el = document.getElementById('last');
    try {
      const res = await store({ op: 'get', key: 'last' });
      const entry = res.ok && res.result;
      el.textContent = entry
        ? `Last run: ${entry.value.action} — “${entry.value.question}”`
        : 'Nothing run yet.';
    } catch {
      el.textContent = '';
    }
  }

  document.getElementById('search').addEventListener('click', () => run('search'));
  document.getElementById('ask').addEventListener('click', () => run('web_answer'));
  showLast();
</script>
